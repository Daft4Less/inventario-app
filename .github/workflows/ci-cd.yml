name: CI/CD
on:
  push:
    branches: [ "main" ]
env:
  REGISTRY: ghcr.io
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
  build-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      - name: Calcular nombre de imagen en minusculas
        id: image_name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build local de la imagen para escaneo
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: local-scan:${{ github.sha }}
      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-scan:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Etiquetar y publicar imagen en ghcr.io
        run: |
          docker tag local-scan:${{ github.sha }} ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}:${{ github.sha }}
          docker tag local-scan:${{ github.sha }} ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}:latest
          docker push ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}:latest