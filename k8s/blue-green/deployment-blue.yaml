apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-blue
  labels:
    app: inventario-app
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-app
      color: blue
  template:
    metadata:
      labels:
        app: inventario-app
        color: blue
    spec:
      containers:
        - name: inventario-app
          image: ghcr.io/daft4less/inventario-app:latest
          env:
            - name: APP_VERSION
              value: "v1"
            - name: APP_COLOR
              value: "blue"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10